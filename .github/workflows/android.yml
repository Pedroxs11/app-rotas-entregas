name: Android Build

on:
  push:
    branches:
      - main
      - play-internal-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create --platforms=android,ios --org com.pedro .

      - name: Configure permanent Android application id
        shell: bash
        run: |
          sed -i 's/com\.pedro\.app_rotas_entregas/com.pedro.rotasentregas/g' android/app/build.gradle.kts
          grep -q 'namespace = "com.pedro.rotasentregas"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.pedro.rotasentregas"' android/app/build.gradle.kts

      - name: Configure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          additions = (
              marker + '\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          )
          if "android.permission.CAMERA" not in s:
              s = s.replace(marker, additions, 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build phone APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build validation AAB
        run: flutter build appbundle --debug

      # A Play-ready release is built only when all four signing secrets exist.
      # The keystore itself is decoded only inside the ephemeral GitHub runner.
      - name: Configure Play release signing
        if: ${{ env.SIGNING_READY == 'true' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          normalized = "".join(raw.split())
          if not normalized or len(normalized) % 4 != 0:
              raise SystemExit(f"ANDROID_KEYSTORE_BASE64 has invalid length: {len(normalized)}")
          try:
              data = base64.b64decode(normalized, validate=True)
          except Exception as exc:
              raise SystemExit(f"ANDROID_KEYSTORE_BASE64 is not valid Base64: {exc}")
          if len(data) < 1000:
              raise SystemExit("Decoded keystore is unexpectedly small")
          Path("android/app/upload-keystore.jks").write_bytes(data)
          print(f"Decoded keystore: {len(data)} bytes")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          needle = "    buildTypes {"
          signing = """    signingConfigs {
              create("release") {
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  storeFile = file("upload-keystore.jks")
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }

          """
          if 'create("release")' not in s:
              s = s.replace(needle, signing + needle, 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
              1,
          )
          p.write_text(s)
          PY

      - name: Build signed Play release AAB
        if: ${{ env.SIGNING_READY == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify generated Android packages
        shell: bash
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk >/dev/null
          ls -lh build/app/outputs/bundle/debug/app-debug.aab
          unzip -t build/app/outputs/bundle/debug/app-debug.aab >/dev/null
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            ls -lh build/app/outputs/bundle/release/app-release.aab
            unzip -t build/app/outputs/bundle/release/app-release.aab >/dev/null
          fi

      # Upload is delivery-only. GitHub can reject it when the account artifact
      # storage quota is full even though analyze, tests and the APK build passed.
      # Keep CI green in that infrastructure-only case; the APK is still verified
      # by the previous step.
      - name: Upload phone APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rotas-entregas-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          compression-level: 0

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: rotas-entregas-play-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
          compression-level: 0
