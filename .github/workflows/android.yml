name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create --platforms=android,ios --org com.pedro .

      - name: Configure permanent Android application id
        shell: bash
        run: |
          sed -i 's/com\.pedro\.app_rotas_entregas/com.pedro.rotasentregas/g' android/app/build.gradle.kts
          grep -q 'namespace = "com.pedro.rotasentregas"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.pedro.rotasentregas"' android/app/build.gradle.kts

      - name: Configure Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          additions = (
              marker + '\n'
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          )
          if "android.permission.CAMERA" not in s:
              s = s.replace(marker, additions, 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build phone APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build Play test AAB
        run: flutter build appbundle --debug

      - name: Verify generated Android packages
        shell: bash
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk >/dev/null
          ls -lh build/app/outputs/bundle/debug/app-debug.aab
          unzip -t build/app/outputs/bundle/debug/app-debug.aab >/dev/null

      # Upload is delivery-only. GitHub can reject it when the account artifact
      # storage quota is full even though analyze, tests and the APK build passed.
      # Keep CI green in that infrastructure-only case; the APK is still verified
      # by the previous step.
      - name: Upload phone APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rotas-entregas-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          compression-level: 0
